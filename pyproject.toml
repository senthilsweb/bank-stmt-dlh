[project]
name = "bank-stmt-dlh"
version = "0.1.0"
description = "Parse bank statement PDFs (HDFC current account) into a reconciled ledger: DuckDB locally or a Databricks lakehouse, with category, recurring and cash reports"
authors = [
    { name = "Senthilnathan Karuppaiah" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "boto3>=1.43.114",
    "reportlab>=5.1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "jupyter>=1.0",
]
docs = [
    "mkdocs-material>=9.5",
]
